name: Build patched FiveM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      CFX_PRODUCT_NAME: fivem
      CFX_DRY_RUN: "true"
      CFX_RETAIL_BUILD: "false"

      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Force node-gyp to Python 3.11
        shell: pwsh
        run: |
          $python = (Get-Command python).Source

          echo "PYTHON=$python" >> $env:GITHUB_ENV
          echo "npm_config_python=$python" >> $env:GITHUB_ENV

          python -m pip install --upgrade pip
          python -m pip install setuptools

      - name: Select installed Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $sdkLibRoot = Join-Path $sdkRoot 'Lib'
          $sdkIncludeRoot = Join-Path $sdkRoot 'Include'

          $sdkVersions = Get-ChildItem $sdkLibRoot -Directory |
            Where-Object {
              (Test-Path (Join-Path $_.FullName 'um\x64\WindowsApp.lib')) -and
              (Test-Path (Join-Path $sdkIncludeRoot "$($_.Name)\um\Windows.h"))
            } |
            Sort-Object {
              try { [version]$_.Name }
              catch { [version]'0.0.0.0' }
            } -Descending

          $sdk = $sdkVersions | Select-Object -First 1

          if (-not $sdk) {
            throw "No usable Windows SDK was found under '$sdkRoot'."
          }

          $version = $sdk.Name
          $include = Join-Path $sdkIncludeRoot $version
          $lib = $sdk.FullName

          "WindowsSdkDir=$sdkRoot\" >> $env:GITHUB_ENV
          "WindowsSDKVersion=$version\" >> $env:GITHUB_ENV
          "WindowsSdkLibVersion=$version\" >> $env:GITHUB_ENV
          "WindowsSDKLibPath=$lib" >> $env:GITHUB_ENV
          "WindowsSDKIncludePath=$include" >> $env:GITHUB_ENV
          "CFX_WINDOWS_SDK=$version" >> $env:GITHUB_ENV

          Write-Host "Using Windows SDK $version"
          Write-Host "Include: $include"
          Write-Host "Lib: $lib"

      - name: Build FiveM client
        shell: pwsh
        run: |
          .\code\tools\ci\build_client.ps1

      # data/redist/crt ships an older runtime than the runner's compiler, and code built with MSVC 14.40+ crashes on an older msvcp140 (constexpr std::mutex/condition_variable)
      - name: Bundle matching VC++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsDir = & $vswhere -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redistVersion = (Get-Content "$vsDir\VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt" | Select-Object -First 1).Trim()
          $crtDir = Get-ChildItem "$vsDir\VC\Redist\MSVC\$redistVersion\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1

          if (-not $crtDir) {
            throw "No VC++ runtime found under '$vsDir\VC\Redist\MSVC\$redistVersion\x64'."
          }

          Copy-Item -Force "$($crtDir.FullName)\*.dll" caches\fivereborn\bin\

          Write-Host "Bundled VC++ runtime $redistVersion from $($crtDir.FullName)"
          Get-ChildItem caches\fivereborn\bin\msvcp140.dll, caches\fivereborn\bin\vcruntime140.dll |
            ForEach-Object { Write-Host "$($_.Name) $($_.VersionInfo.FileVersion)" }

      - name: Upload client
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fivem-client
          include-hidden-files: true
          path: caches/fivereborn/**

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = Join-Path $env:RUNNER_TEMP 'release\FiveM'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse -Force caches\fivereborn\* $stage

          Move-Item (Join-Path $stage 'CitizenFX.exe') (Join-Path $stage 'FiveM.exe')
          # an empty FiveM.exe.formaldev makes the launcher skip its update check, which would otherwise replace these files with the official build
          New-Item -ItemType File (Join-Path $stage 'FiveM.exe.formaldev') | Out-Null

          7z a -tzip fivem-client.zip $stage
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = "build-${{ github.run_number }}"
          $shortSha = "${{ github.sha }}".Substring(0, 9)

          gh release create $tag fivem-client.zip `
            --target "${{ github.sha }}" `
            --title "Build ${{ github.run_number }} ($shortSha)" `
            --notes "FiveM client built from ${{ github.sha }}. Extract the FiveM folder and follow https://izmystic.dev/blog/fivem-on-linux" `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
